on:
  push:
    branches: [main]
    paths: ["pkg-r/**", ".github/workflows/docs.yaml"]
  workflow_dispatch:

name: docs

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::./pkg-r
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages("pkg-r", new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Prepare deployment
        run: |
          mkdir -p _site/r
          cp -r pkg-r/docs/* _site/r/
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta http-equiv="refresh" content="0; url=r/"></head></html>
          HTML
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: _site
