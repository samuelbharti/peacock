on:
  release:
    types: [published]

name: release-py

permissions:
  # A permissions block replaces the defaults rather than adding to them,
  # so contents has to be named or actions/checkout cannot read the repo.
  contents: read
  id-token: write

defaults:
  run:
    working-directory: pkg-py

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg-py/dist/
