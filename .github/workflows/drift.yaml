on:
  push:
    branches: [main]
    paths: ["shared/**", "pkg-r/inst/templates.dcf", "pkg-py/src/peacock_init/_data/templates.yaml"]
  pull_request:
    paths: ["shared/**", "pkg-r/inst/templates.dcf", "pkg-py/src/peacock_init/_data/templates.yaml"]

name: drift

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pyyaml python tools/sync_shared.py
      - run: git diff --exit-code
        name: Verify vendored copies are in sync
