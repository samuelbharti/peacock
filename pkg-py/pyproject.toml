[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "peacock-init"
version = "0.2.0"
description = "Scaffold project directories from templates. Python CLI companion to the peacock R package."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Bharti", email = "samuelbharti.io@gmail.com" }]
keywords = ["scaffolding", "project-templates", "cookiecutter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["click>=8", "pyyaml>=6"]

[project.scripts]
peacock = "peacock_init.cli:main"

[project.urls]
Homepage = "https://github.com/samuelbharti/peacock"
Documentation = "https://www.samuelbharti.com/peacock/"
Source = "https://github.com/samuelbharti/peacock"
Issues = "https://github.com/samuelbharti/peacock/issues"
Changelog = "https://github.com/samuelbharti/peacock/blob/main/pkg-py/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peacock_init"]

[tool.hatch.build.targets.sdist]
include = [
    "src/peacock_init",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["peacock_init"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
